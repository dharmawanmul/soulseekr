<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SoundWrapped — Aesthetic Music Artifacts</title>
  <meta name="description" content="Beyond flat receipts. Turn your Spotify top tracks into museum-grade physical artifacts: Vinyl master sleeves, Swiss posters, spatial sound prisms, and teenage engineering cassettes.">
  <meta name="theme-color" content="#09090b">

  <!-- OpenGraph Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="SoundWrapped — Aesthetic Music Wrapped Artifacts">
  <meta property="og:description" content="Turn your music into tangible design artifacts with 3D tilt, real 30s studio audio previews, and high-DPI export.">

  <!-- Tailwind CSS via CDN with customized configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#09090b',
            foreground: '#fafafa',
            card: '#121215',
            border: 'rgba(255, 255, 255, 0.08)',
            spotify: '#10b981'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Outfit', 'Syne', 'sans-serif'],
            mono: ['Space Mono', 'Courier Prime', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Editorial & Physical Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Press+Start+2P&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Design System & Artifact Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/cards.css">

  <!-- html2canvas for High-DPI Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body class="bg-[#09090b] text-[#fafafa]">

  <!-- Architectural Background Grid & Vignette Texture -->
  <div class="bg-canvas-texture" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- Apple-Style Translucent Navigation Bar -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-badge-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.306c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.648-1.168-.41.094-.823-.162-.917-.573-.095-.41.162-.823.573-.918 4.623-1.056 8.577-.614 11.776 1.367.358.218.472.68.254 1.038zm1.47-3.267c-.276.449-.864.593-1.313.317-3.259-2.003-8.228-2.583-12.083-1.413-.505.153-1.039-.136-1.192-.641-.153-.505.137-1.039.642-1.192 4.41-1.338 9.888-.686 13.626 1.616.449.276.593.864.32 1.313zm.126-3.41c-3.908-2.321-10.354-2.535-14.075-1.405-.599.182-1.233-.161-1.415-.76-.182-.599.161-1.233.76-1.415 4.277-1.298 11.393-1.047 15.864 1.607.538.319.715 1.015.396 1.553-.319.538-1.015.715-1.53.397z"/>
        </svg>
      </div>
      <div class="brand-meta">
        <h1 class="brand-title">SoundWrapped</h1>
        <span class="brand-tagline">Physical Music Artifacts</span>
      </div>
    </div>

    <div class="header-actions">
      <span id="auth-status-badge" class="auth-badge badge-unauth">NOT CONNECTED</span>

      <button id="btn-custom-mix" class="btn btn-secondary" title="Pick any 5 songs & artists">
        Custom Mix
      </button>

      <button id="btn-connect-spotify" class="btn btn-spotify" title="Connect your Spotify account via PKCE">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.306c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.648-1.168-.41.094-.823-.162-.917-.573-.095-.41.162-.823.573-.918 4.623-1.056 8.577-.614 11.776 1.367.358.218.472.68.254 1.038zm1.47-3.267c-.276.449-.864.593-1.313.317-3.259-2.003-8.228-2.583-12.083-1.413-.505.153-1.039-.136-1.192-.641-.153-.505.137-1.039.642-1.192 4.41-1.338 9.888-.686 13.626 1.616.449.276.593.864.32 1.313zm.126-3.41c-3.908-2.321-10.354-2.535-14.075-1.405-.599.182-1.233-.161-1.415-.76-.182-.599.161-1.233.76-1.415 4.277-1.298 11.393-1.047 15.864 1.607.538.319.715 1.015.396 1.553-.319.538-1.015.715-1.53.397z"/>
        </svg>
        Connect Spotify
      </button>

      <button id="btn-logout" class="btn btn-secondary" style="display: none;">
        Log Out
      </button>
    </div>
  </header>

  <!-- Main Experience Studio -->
  <main class="main-layout">
    
    <!-- Segmented Inspector & Archetype Switcher -->
    <section class="controls-hub" aria-label="Controls">
      <div class="segmented-toolbar">
        
        <!-- Physical Card Archetype Segmented Control -->
        <div class="segmented-group" role="tablist">
          <button class="seg-btn active" data-style="vinyl" role="tab" aria-selected="true">
            💿 Vinyl Obi
          </button>
          <button class="seg-btn" data-style="swiss" role="tab" aria-selected="false">
            📐 Swiss Poster
          </button>
          <button class="seg-btn" data-style="prism" role="tab" aria-selected="false">
            🔮 Sound Prism
          </button>
          <button class="seg-btn" data-style="cassette" role="tab" aria-selected="false">
            📼 Industrial Tape
          </button>
          <button class="seg-btn" data-style="receipt" role="tab" aria-selected="false">
            🧾 Thermal Slip
          </button>
        </div>

        <!-- Timeframe Segmented Control -->
        <div class="time-segmented-group" aria-label="Timeframe">
          <button class="time-btn active" data-range="short_term">4 Weeks</button>
          <button class="time-btn" data-range="medium_term">6 Months</button>
          <button class="time-btn" data-range="long_term">All Time</button>
        </div>

      </div>
    </section>

    <!-- 3D Interactive Card Stage with Specular Glare (motion-primitives) -->
    <section class="card-stage-wrapper" aria-label="Interactive Card Stage">
      <div id="card-tilt-container">
        <!-- Rendered dynamically by js/app.js -->
        <div id="card-display-container"></div>
        <div class="card-specular-glare" id="specular-glare"></div>
      </div>
    </section>

    <!-- Export & Social Action Dock -->
    <section class="export-dock" aria-label="Export Actions">
      <button id="btn-export-story" class="btn btn-export btn-export-primary" title="Download formatted for Instagram / TikTok Stories">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        Download Story (9:16)
      </button>

      <button id="btn-export-square" class="btn btn-export" title="Download square post for feed">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        </svg>
        Download Square (1:1)
      </button>

      <button id="btn-copy-clip" class="btn btn-export" title="Copy high-res snapshot to clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy Image
      </button>
    </section>

  </main>

  <!-- Apple Music Style Dynamic Island Floating Audio Dock -->
  <aside id="now-playing-bar" class="dynamic-audio-dock" aria-live="polite">
    <div class="dock-disc-art">
      <img id="dock-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=100&q=80" alt="art" />
    </div>
    <div class="mini-eq" style="color: #10b981;">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
    <div class="dock-meta">
      <span id="np-track-name" class="dock-title">Track Name</span>
      <span id="np-artist-name" class="dock-artist">Artist Name</span>
    </div>
    <button id="np-stop-btn" class="btn-dock-close" title="Stop Audio">✕</button>
  </aside>


  <!-- Custom Top 5 Mix Dialog -->
  <div id="custom-mix-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="custom-modal-title">
    <div class="modal-card" style="max-width: 540px;">
      <div class="modal-header-row">
        <h2 id="custom-modal-title">Custom Top 5 Mix</h2>
        <button id="btn-custom-cancel" class="btn-dock-close" title="Close">✕</button>
      </div>
      <p>
        Select a preset or type any 5 songs and artists. Real 30-second studio audio and high-resolution album artwork will be fetched automatically!
      </p>

      <div style="font-size: 0.7rem; font-weight: 700; color: #71717a; margin-bottom: 0.4rem; letter-spacing:0.05em;">PRESETS:</div>
      <div class="preset-chips-row">
        <button class="preset-chip" data-preset="synthwave">🌆 Synthwave Drive</button>
        <button class="preset-chip" data-preset="indie">🎸 2000s Indie Rock</button>
        <button class="preset-chip" data-preset="pop">✨ Pop Chart Toppers</button>
        <button class="preset-chip" data-preset="classics">💿 Vinyl Classics</button>
      </div>

      <div class="custom-inputs-list" id="custom-inputs-list">
        <div class="custom-input-row">
          <input type="text" class="c-song" placeholder="Song 1" value="Starboy" />
          <input type="text" class="c-artist" placeholder="Artist 1" value="The Weeknd" />
        </div>
        <div class="custom-input-row">
          <input type="text" class="c-song" placeholder="Song 2" value="Midnight City" />
          <input type="text" class="c-artist" placeholder="Artist 2" value="M83" />
        </div>
        <div class="custom-input-row">
          <input type="text" class="c-song" placeholder="Song 3" value="Levitating" />
          <input type="text" class="c-artist" placeholder="Artist 3" value="Dua Lipa" />
        </div>
        <div class="custom-input-row">
          <input type="text" class="c-song" placeholder="Song 4" value="505" />
          <input type="text" class="c-artist" placeholder="Artist 4" value="Arctic Monkeys" />
        </div>
        <div class="custom-input-row">
          <input type="text" class="c-song" placeholder="Song 5" value="Space Song" />
          <input type="text" class="c-artist" placeholder="Artist 5" value="Beach House" />
        </div>
      </div>

      <div class="modal-btn-row">
        <button id="btn-custom-cancel-alt" class="btn btn-secondary">Cancel</button>
        <button id="btn-custom-generate" class="btn btn-export-primary">Generate Artifacts</button>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- App Main Orchestrator (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
