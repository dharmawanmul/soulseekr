<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soulseekr — Aesthetic Music Artifacts</title>
  <meta name="description" content="Beyond flat receipts. Turn your Spotify top tracks into museum-grade physical artifacts: Vinyl master sleeves, Swiss posters, spatial sound prisms, and teenage engineering cassettes.">
  <meta name="theme-color" content="#09090b">

  <!-- OpenGraph Metadata -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Soulseekr — Aesthetic Music Wrapped Artifacts">
  <meta property="og:description" content="Turn your music into tangible design artifacts with 3D tilt, real 30s studio audio previews, and high-DPI export.">

  <!-- Tailwind CSS via CDN with customized configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#09090b',
            foreground: '#fafafa',
            card: '#121215',
            border: 'rgba(255, 255, 255, 0.08)',
            spotify: '#10b981'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
            display: ['Outfit', 'Syne', 'sans-serif'],
            mono: ['Space Mono', 'Courier Prime', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Editorial & Physical Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Outfit:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

  <!-- Design System & Artifact Stylesheets -->
  <link rel="stylesheet" href="css/style.css?v=3.0">
  <link rel="stylesheet" href="css/cards.css?v=3.0">
  <link rel="stylesheet" href="css/wrapped.css?v=3.0">
  <link rel="stylesheet" href="css/amaze-me.css?v=3.0">

  <!-- Three.js WebGL Engine for 3D Wrapped Visualizer -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <!-- html2canvas for High-DPI Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
</head>
<body class="bg-[#09090b] text-[#fafafa]">

  <!-- Architectural Background Grid & Vignette Texture -->
  <div class="bg-canvas-texture" aria-hidden="true"></div>
  <div class="bg-vignette" aria-hidden="true"></div>

  <!-- Apple-Style Translucent Navigation Bar -->
  <header class="app-header">
    <div class="brand-wrapper">
      <div class="brand-badge-icon">
        <svg viewBox="0 0 24 24">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.306c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.648-1.168-.41.094-.823-.162-.917-.573-.095-.41.162-.823.573-.918 4.623-1.056 8.577-.614 11.776 1.367.358.218.472.68.254 1.038zm1.47-3.267c-.276.449-.864.593-1.313.317-3.259-2.003-8.228-2.583-12.083-1.413-.505.153-1.039-.136-1.192-.641-.153-.505.137-1.039.642-1.192 4.41-1.338 9.888-.686 13.626 1.616.449.276.593.864.32 1.313zm.126-3.41c-3.908-2.321-10.354-2.535-14.075-1.405-.599.182-1.233-.161-1.415-.76-.182-.599.161-1.233.76-1.415 4.277-1.298 11.393-1.047 15.864 1.607.538.319.715 1.015.396 1.553-.319.538-1.015.715-1.53.397z"/>
        </svg>
      </div>
      <div class="brand-meta">
        <h1 class="brand-title">Soulseekr</h1>
        <span class="brand-tagline">Physical Music Artifacts</span>
      </div>
    </div>

    <div class="header-actions">
      <!-- 3D Spotify Wrapped Experience Trigger -->
      <button id="btn-open-wrapped" class="btn btn-wrapped" title="Launch 3D Spotify Wrapped Experience">
        <!-- Waveform SVG — no emoji -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M2 12h2M6 6v12M10 9v6M14 4v16M18 8v8M22 12h2"/>
        </svg>
        <span>Wrapped</span>
        <span class="wrapped-badge-pill">3D</span>
      </button>

      <!-- Amaze Me Multiverse Experience Trigger -->
      <button id="btn-amaze-me" class="btn btn-amaze" title="Launch Amaze Me Multiverse Experience">
        <svg class="amaze-btn-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.93 4.93l2.12 2.12M16.95 16.95l2.12 2.12M4.93 19.07l2.12-2.12M16.95 7.05l2.12-2.12"/>
        </svg>
        <span>Amaze Me</span>
        <span class="amaze-badge-pill">COSMIC</span>
      </button>

      <span id="auth-status-badge" class="auth-badge badge-unauth">NOT CONNECTED</span>

      <button id="btn-connect-spotify" class="btn btn-spotify" title="Connect your Spotify account via PKCE">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.503 17.306c-.218.358-.68.472-1.038.254-2.846-1.74-6.428-2.134-10.648-1.168-.41.094-.823-.162-.917-.573-.095-.41.162-.823.573-.918 4.623-1.056 8.577-.614 11.776 1.367.358.218.472.68.254 1.038zm1.47-3.267c-.276.449-.864.593-1.313.317-3.259-2.003-8.228-2.583-12.083-1.413-.505.153-1.039-.136-1.192-.641-.153-.505.137-1.039.642-1.192 4.41-1.338 9.888-.686 13.626 1.616.449.276.593.864.32 1.313zm.126-3.41c-3.908-2.321-10.354-2.535-14.075-1.405-.599.182-1.233-.161-1.415-.76-.182-.599.161-1.233.76-1.415 4.277-1.298 11.393-1.047 15.864 1.607.538.319.715 1.015.396 1.553-.319.538-1.015.715-1.53.397z"/>
        </svg>
        Connect Spotify
      </button>

      <button id="btn-logout" class="btn btn-secondary" style="display: none;">
        Log Out
      </button>
    </div>
  </header>

  <!-- Main Experience Studio -->
  <main class="main-layout">
    
    <!-- Segmented Inspector & Archetype Switcher -->
    <section class="controls-hub" aria-label="Controls">
      <!-- 7 Physical Card Archetypes — editorial tab bar, no emoji -->
      <div class="segmented-toolbar" role="tablist" aria-label="Card Archetype">
        <button class="seg-btn active" data-style="vinyl" role="tab" aria-selected="true">
          <!-- Vinyl / record groove lines icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="10"/>
            <circle cx="12" cy="12" r="4"/>
            <circle cx="12" cy="12" r="1" fill="currentColor"/>
          </svg>
          Vinyl Obi
        </button>
        <button class="seg-btn" data-style="swiss" role="tab" aria-selected="false">
          <!-- Grid / layout icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="3" width="7" height="18" rx="1"/>
            <rect x="14" y="3" width="7" height="7" rx="1"/>
            <rect x="14" y="14" width="7" height="7" rx="1"/>
          </svg>
          Swiss Poster
        </button>
        <button class="seg-btn" data-style="prism" role="tab" aria-selected="false">
          <!-- Triangle prism icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3L22 21H2L12 3Z"/>
            <line x1="12" y1="3" x2="12" y2="21"/>
          </svg>
          Sound Prism
        </button>
        <button class="seg-btn" data-style="cassette" role="tab" aria-selected="false">
          <!-- Cassette reel icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="2" y="6" width="20" height="14" rx="2"/>
            <circle cx="8" cy="13" r="2.5"/>
            <circle cx="16" cy="13" r="2.5"/>
            <path d="M10.5 13h3"/>
            <path d="M5 20V6"/>
            <path d="M19 20V6"/>
          </svg>
          Tape Cassette
        </button>
        <button class="seg-btn" data-style="receipt" role="tab" aria-selected="false">
          <!-- Receipt icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M6 2h12a1 1 0 011 1v17l-3-2-2 2-2-2-2 2-3-2V3a1 1 0 011-1z"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="9" y1="12" x2="15" y2="12"/>
          </svg>
          Thermal Slip
        </button>
        <button class="seg-btn" data-style="dap" role="tab" aria-selected="false">
          <!-- DAP Hi-Fi Audiophile Player icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="4" y="2" width="16" height="20" rx="3"/>
            <circle cx="12" cy="14" r="3"/>
            <line x1="8" y1="6" x2="16" y2="6"/>
          </svg>
          Titanium DAP
        </button>
        <button class="seg-btn" data-style="vippass" role="tab" aria-selected="false">
          <!-- ID badge / pass icon -->
          <svg class="seg-icon-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M8 4v2M16 4v2"/>
            <circle cx="12" cy="12" r="2.5"/>
            <path d="M7 18c0-2.2 2.2-4 5-4s5 1.8 5 4"/>
          </svg>
          VIP Pass
        </button>
      </div>

      <!-- Timeframe Segmented Filter -->
      <div class="timeframe-bar" aria-label="Listening Timeframe">
        <span class="timeframe-label">TIMEFRAME</span>
        <div class="time-segmented-group" role="radiogroup">
          <button class="time-btn active" data-range="short_term" role="radio" aria-checked="true">4 Weeks</button>
          <button class="time-btn" data-range="medium_term" role="radio" aria-checked="false">6 Months</button>
          <button class="time-btn" data-range="long_term" role="radio" aria-checked="false">All Time</button>
        </div>
      </div>
    </section>

    <!-- 3D Interactive Card Stage with Specular Glare -->
    <section class="card-stage-wrapper" aria-label="Interactive Card Stage">
      <div id="card-tilt-container">
        <!-- Rendered dynamically by js/app.js -->
        <div id="card-display-container"></div>
        <div class="card-specular-glare" id="specular-glare"></div>
      </div>
    </section>

    <!-- Export & Social Action Dock -->
    <section class="export-dock" aria-label="Export Actions">
      <button id="btn-export-story" class="btn btn-export btn-export-primary" title="Download formatted for Instagram / TikTok Stories">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="5" y="2" width="14" height="20" rx="3" ry="3"/>
          <line x1="12" y1="18" x2="12.01" y2="18"/>
        </svg>
        Download Story (9:16)
      </button>

      <button id="btn-export-square" class="btn btn-export" title="Download square post for feed">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        </svg>
        Download Square (1:1)
      </button>

      <button id="btn-copy-clip" class="btn btn-export" title="Copy high-res snapshot to clipboard">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Copy Image
      </button>
    </section>

  </main>

  <!-- Apple Music Style Dynamic Island Floating Audio Dock -->
  <aside id="now-playing-bar" class="dynamic-audio-dock" aria-live="polite">
    <div class="dock-disc-art">
      <img id="dock-thumb" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?auto=format&fit=crop&w=100&q=80" alt="art" />
    </div>
    <div class="mini-eq" style="color: #10b981;">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </div>
    <div class="dock-meta">
      <span id="np-track-name" class="dock-title">Track Name</span>
      <span id="np-artist-name" class="dock-artist">Artist Name</span>
    </div>
    <button id="np-stop-btn" class="btn-dock-close" title="Stop Audio">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 6L6 18M6 6l12 12" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
    </button>
  </aside>




  <!-- Notification Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Fullscreen 3D Spotify Wrapped Experience Modal -->
  <div id="wrapped-modal" class="wrapped-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Spotify Wrapped 3D Experience">
    <canvas id="wrapped-three-canvas"></canvas>

    <!-- Floating Desktop Nav Chevrons -->
    <button id="wrapped-nav-prev" class="wrapped-nav-arrow wrapped-nav-prev" title="Previous Story (Left Arrow)" aria-label="Previous Story">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <button id="wrapped-nav-next" class="wrapped-nav-arrow wrapped-nav-next" title="Next Story (Right Arrow / Space)" aria-label="Next Story">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="wrapped-stage-glow" id="wrapped-stage-glow"></div>

    <div class="wrapped-stage">
      <!-- Top Progress Bar & Header Meta -->
      <div class="wrapped-header-bar">
        <div class="wrapped-progress-track" id="wrapped-progress-track"></div>
        <div class="wrapped-user-row">
          <div class="wrapped-user-identity">
            <img id="wrapped-user-avatar" class="wrapped-user-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="avatar">
            <div class="wrapped-user-meta">
              <span id="wrapped-user-name" class="wrapped-user-name">Soulseekr Archivist</span>
              <span id="wrapped-user-tag" class="wrapped-user-tag">2026 Archive</span>
            </div>
          </div>
          <div class="wrapped-top-controls">
            <button id="btn-wrapped-mute" class="btn-wrapped-control" title="Toggle Audio (Mute / Unmute)" aria-label="Toggle mute">
              <!-- Speaker icon -->
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
              </svg>
            </button>
            <button id="btn-wrapped-close" class="btn-wrapped-control" title="Close Wrapped (Esc)" aria-label="Close">
              <!-- Close X icon -->
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
                <line x1="18" y1="6" x2="6" y2="18"/>
                <line x1="6" y1="6" x2="18" y2="18"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Tap Navigation Zones -->
      <div id="wrapped-tap-left" class="wrapped-tap-zone wrapped-tap-zone-left" title="Tap left to go back"></div>
      <div id="wrapped-tap-right" class="wrapped-tap-zone wrapped-tap-zone-right" title="Tap right to continue"></div>

      <!-- Slides Viewport (Rendered dynamically) -->
      <div class="wrapped-slides-viewport" id="wrapped-slides-viewport"></div>
    </div>
  </div>

  <!-- Amaze Me Multiverse Interactive Canvas & HUD Overlay -->
  <div id="amaze-modal" class="amaze-modal" aria-hidden="true" role="dialog" aria-modal="true">
    <canvas id="amaze-canvas" class="amaze-canvas"></canvas>
    
    <!-- Atmospheric VFX layers (Crisp high-resolution space, no pixelated noise) -->
    <div class="amaze-vignette" aria-hidden="true"></div>
    <div class="amaze-speed-lines" id="amaze-speed-lines" aria-hidden="true"></div>

    <!-- HUD Chrome Top Bar -->
    <div class="amaze-top-hud">
      <div class="amaze-hud-brand">
        <div class="amaze-hud-pill">
          <span class="amaze-pulsing-dot"></span>
          <span id="amaze-hud-scene-name" class="amaze-hud-title">SCENE 01 / SOLAR SYSTEM</span>
        </div>
        <span class="amaze-hud-sub" id="amaze-hud-sub">TOP 5 TRACKS IN ORBITAL RESONANCE</span>
      </div>

      <div class="amaze-hud-controls">
        <button id="btn-amaze-audio" class="amaze-hud-btn is-active" title="Toggle Soundscape / Audio (M)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
        <button id="btn-amaze-fullscreen" class="amaze-hud-btn" title="Toggle Fullscreen">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 3 21 3 21 9"/>
            <polyline points="9 21 3 21 3 15"/>
            <line x1="21" y1="3" x2="14" y2="10"/>
            <line x1="3" y1="21" x2="10" y2="14"/>
          </svg>
        </button>
        <button id="btn-amaze-close" class="amaze-hud-btn" title="Exit Amaze Me (Esc)">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- NASA Eyes 3D Projected Billboard Tags Layer (Stay anchored above stationary planets) -->
    <div id="amaze-billboards-layer" class="amaze-billboards-layer"></div>

    <!-- NASA Eyes Planetary Quick-Selector Bar (Bottom Center) -->
    <div id="amaze-planet-selector-bar" class="amaze-planet-selector-bar"></div>

    <!-- NASA Eyes Planet Detail Fly-To Inspector Drawer -->
    <div id="amaze-inspector-drawer" class="amaze-inspector-drawer"></div>

    <!-- Right Side Scene Progress Rail -->
    <div class="amaze-scene-nav" id="amaze-scene-nav"></div>

    <!-- Dynamic 2D/3D Contextual Tooltip & Target HUD reticle -->
    <div id="amaze-planet-tooltip" class="amaze-planet-tooltip"></div>

    <!-- Bottom Telemetry & Navigation Prompts -->
    <div class="amaze-bottom-hud">
      <div class="amaze-scroll-prompt">
        <span class="amaze-scroll-mouse">
          <span class="amaze-scroll-wheel"></span>
        </span>
        <span class="amaze-scroll-label">SCROLL / SWIPE TO DIVE DEEPER</span>
      </div>
      <div class="amaze-telemetry" id="amaze-telemetry">
        <span class="amaze-telem-item">VELOCITY: <b id="amaze-telem-vel">0.12c</b></span>
        <span class="amaze-telem-divider">|</span>
        <span class="amaze-telem-item">COORDINATES: <b id="amaze-telem-coords">RA 18h 36m / DEC +38°</b></span>
      </div>
    </div>
  </div>

  <!-- App Main Orchestrator (ES Module) -->
  <script type="module" src="js/app.js?v=3.0"></script>
</body>
</html>
